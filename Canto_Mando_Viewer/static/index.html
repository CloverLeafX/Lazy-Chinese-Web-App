<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canto → Mando Blueprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn" id="sidebarToggle" title="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-brand">
        <span class="brand-title">Canto → Mando</span>
        <span class="brand-sub">Blueprint</span>
      </div>
    </div>

    <div class="header-spacer"></div>

    <div class="header-right">
      <a class="icon-btn" href="/myphrases" title="Open My Phrases" aria-label="Open My Phrases">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/></svg>
      </a>
      <a class="icon-btn" href="/myphrases/static/grammar.html" title="Grammar Reference" aria-label="Grammar Reference">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </a>
      <a class="icon-btn" href="/lazy" title="Open CI" aria-label="Open CI">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="8 5 19 12 8 19 8 5"/></svg>
      </a>
      <button class="icon-btn" id="phrasesToggle" title="Toggle Phrases panel">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn" id="killServerBtn" title="Stop server" style="color:var(--danger,#e53e3e)">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </button>
    </div>
  </header>

  <!-- ── App body ────────────────────────────────────────────────────────── -->
  <div class="app-body">

    <!-- Left sidebar: course navigation -->
    <aside class="course-sidebar" id="courseSidebar">
      <div class="sidebar-inner">
        <div class="sidebar-heading">Course Map</div>
        <div class="sidebar-list" id="sidebarList"></div>
      </div>
    </aside>

    <div class="sidebar-resize" id="sidebarResize"></div>

    <!-- Main content area (course only) -->
    <main class="main-area">
      <div class="course-content" id="courseContent">
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <p>Select a lesson from the sidebar</p>
        </div>
      </div>
    </main>

    <!-- Phrases resize handle -->
    <div class="phrases-resize" id="phrasesResize"></div>

    <!-- Right panel: Phrases -->
    <aside class="phrases-panel" id="phrasesPanel">
      <div class="phrases-panel-inner">
        <!-- Panel header -->
        <div class="panel-heading">
          <span>Phrases</span>
          <span id="quickStats" class="panel-stats"></span>
        </div>

        <div class="phrases-shell">

          <!-- Filters -->
          <section class="controls-card">
            <div class="search-wrap">
              <label for="searchInput">Search</label>
              <input id="searchInput" type="search" placeholder="English, 中文, Jyutping, Pinyin…" autocomplete="off" />
            </div>
            <div class="control-grid">
              <label>Type
                <select id="typeFilter">
                  <option value="all">All</option>
                  <option value="vocabulary">Vocabulary</option>
                  <option value="sentence">Sentences</option>
                </select>
              </label>
              <label>Chapter
                <select id="chapterFilter">
                  <option value="all">All chapters</option>
                </select>
              </label>
              <label>Section
                <select id="sectionFilter">
                  <option value="all">All sections</option>
                </select>
              </label>
              <label>Script
                <select id="scriptMode">
                  <option value="both">Canto + Mando</option>
                  <option value="canto">Cantonese only</option>
                  <option value="mando">Mandarin only</option>
                </select>
              </label>
            </div>
            <div class="actions-row">
              <button id="resetBtn" class="btn ghost">Reset</button>
              <button id="hiddenBtn" class="btn ghost">Hidden</button>
              <button id="studyBtn" class="btn">Study mode</button>
            </div>
          </section>

          <!-- Results -->
          <section class="results-card" id="resultsCard">
            <div class="results-head">
              <h2 class="results-title">Results</h2>
              <span id="resultCount" class="muted-sm"></span>
            </div>
            <div id="resultList" class="result-list"></div>
            <div class="pager">
              <button id="prevPage" class="btn ghost sm">Previous</button>
              <span id="pageInfo" class="muted-sm"></span>
              <button id="nextPage" class="btn ghost sm">Next</button>
            </div>
          </section>

        </div>
      </div><!-- /phrases-shell -->
    </aside><!-- /phrasesPanel -->

  </div><!-- /app-body -->

  <!-- ── Study Mode Modal ──────────────────────────────────────────────────── -->
  <div class="study-modal-overlay" id="studyModalOverlay" aria-modal="true" role="dialog" aria-label="Study mode">
    <div class="study-modal" id="studyPanel">
      <div class="study-modal-header">
        <div>
          <h2 class="results-title">Focused Study</h2>
          <p class="muted-sm">English first. Reveal when ready.</p>
        </div>
        <button class="icon-btn study-close-btn" id="studyCloseBtn" title="Close study mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p id="studyMeta" class="muted-sm"></p>
      <article class="study-inner" id="studyCard">
        <p class="field-label">English</p>
        <h3 id="studyEnglish"></h3>
        <button id="revealBtn" class="btn" style="margin-top:12px">Reveal Cantonese + Mandarin</button>
        <div id="studyReveal" style="display:none;margin-top:12px">
          <div class="script-block">
            <p class="field-label">Cantonese</p>
            <p id="studyCanto" class="han canto-font"></p>
            <p id="studyJyutping" class="roman"></p>
          </div>
          <div class="script-block">
            <p class="field-label">Mandarin</p>
            <p id="studyMando" class="han mando-font"></p>
            <p id="studyPinyin" class="roman"></p>
          </div>
        </div>
      </article>
      <div class="study-nav">
        <button id="studyPrev" class="btn ghost sm">Back</button>
        <button id="studyNext" class="btn sm">Next</button>
      </div>
      <p class="muted-sm" style="margin-top:8px;font-size:11px">Esc or ✕ close · j/k navigate · Space reveal</p>
    </div>
  </div>

  <script src="/static/app.js?v=9"></script>
</body>
</html>
