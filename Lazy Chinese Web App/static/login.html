<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: #0f1117; color: #e2e4f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #1a1d27; border: 1px solid #2e3350;
      border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 320px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #6c8ef7, #4c6ef5);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
    }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #e2e4f0; }
    form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    input[type="password"] {
      width: 100%; height: 42px; padding: 0 14px;
      background: #222638; border: 1px solid #2e3350; border-radius: 8px;
      color: #e2e4f0; font-size: 14px; font-family: inherit;
    }
    input[type="password"]:focus { outline: none; border-color: #6c8ef7; }
    button[type="submit"] {
      width: 100%; height: 42px;
      background: linear-gradient(135deg, #6c8ef7, #4c6ef5);
      border: none; border-radius: 8px;
      color: #fff; font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: opacity 150ms;
    }
    button[type="submit"]:hover { opacity: .9; }
    .error { font-size: 13px; color: #f56565; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CI</div>
    <h1>CI</h1>
    <!--ERROR-->
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
