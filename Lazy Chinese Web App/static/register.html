<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Chinese — Register passkey</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: #0f1117; color: #e2e4f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #1a1d27; border: 1px solid #2e3350;
      border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .logo-row { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6c8ef7, #4c6ef5);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.5px; flex-shrink: 0;
    }
    h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
    h1 span { color: #6c8ef7; }
    p.sub { font-size: 13px; color: #7a7f9a; line-height: 1.5; }
    label { font-size: 12px; font-weight: 600; color: #7a7f9a; display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; height: 40px; padding: 0 12px;
      background: #222638; border: 1px solid #2e3350; border-radius: 8px;
      color: #e2e4f0; font-size: 14px; font-family: inherit;
    }
    input[type="text"]:focus { outline: none; border-color: #6c8ef7; }
    .reg-btn {
      width: 100%; height: 44px;
      background: linear-gradient(135deg, #6c8ef7, #4c6ef5);
      border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 150ms, transform 100ms;
    }
    .reg-btn:hover { opacity: .9; }
    .reg-btn:active { transform: scale(.98); }
    .reg-btn:disabled { opacity: .45; cursor: not-allowed; }
    .msg {
      padding: 10px 14px; border-radius: 8px;
      font-size: 13px; text-align: center; display: none;
    }
    .msg.error   { background: rgba(245,101,101,.12); border: 1px solid rgba(245,101,101,.3); color: #f56565; display: block; }
    .msg.success { background: rgba(62,207,142,.1);   border: 1px solid rgba(62,207,142,.3);  color: #3ecf8e;  display: block; }
    .creds-list { font-size: 12px; color: #7a7f9a; }
    .creds-list li { padding: 4px 0; border-bottom: 1px solid #2e3350; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo">LC</div>
      <h1>Lazy <span>Chinese</span> — Register passkey</h1>
    </div>
    <p class="sub">Register Face ID or a device passkey for this device. Use the setup token in the URL.</p>

    <div id="statusMsg" class="msg"></div>

    <div>
      <label for="deviceName">Device name</label>
      <input type="text" id="deviceName" placeholder="e.g. iPhone 15, MacBook Pro" autocomplete="off">
    </div>

    <button class="reg-btn" id="regBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/>
        <path d="M19.4 20a7.5 7.5 0 0 0-14.8 0"/>
      </svg>
      Register this device
    </button>

    <div id="credsList" style="display:none">
      <p class="sub" style="margin-bottom:8px">Registered devices:</p>
      <ul class="creds-list" id="credsUl"></ul>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';

    function b64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
    function fromB64url(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return Uint8Array.from(atob(s), c => c.charCodeAt(0));
    }

    const statusMsg = document.getElementById('statusMsg');
    const regBtn    = document.getElementById('regBtn');

    function showMsg(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = 'msg ' + type;
      regBtn.disabled = type !== 'success';
      if (type !== 'success') regBtn.textContent = 'Register this device';
    }

    regBtn.addEventListener('click', async () => {
      const name = document.getElementById('deviceName').value.trim() || 'Device';
      regBtn.disabled = true;
      regBtn.textContent = 'Waiting for passkey…';
      statusMsg.className = 'msg';

      try {
        const opts = await fetch(`/api/register/begin?token=${token}`).then(r => {
          if (!r.ok) throw new Error('Invalid setup token or server error.');
          return r.json();
        });

        opts.challenge = fromB64url(opts.challenge);
        opts.user.id   = fromB64url(opts.user.id);
        if (opts.excludeCredentials) {
          opts.excludeCredentials = opts.excludeCredentials.map(c => ({
            ...c, id: fromB64url(c.id)
          }));
        }

        const cred = await navigator.credentials.create({ publicKey: opts });

        const body = {
          name,
          id:    cred.id,
          rawId: b64url(cred.rawId),
          type:  cred.type,
          response: {
            clientDataJSON:    b64url(cred.response.clientDataJSON),
            attestationObject: b64url(cred.response.attestationObject),
          },
        };

        const res  = await fetch(`/api/register/complete?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        showMsg(`✓ "${name}" registered successfully! You can now sign in on this device.`, 'success');
        document.getElementById('deviceName').value = '';
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          showMsg('Passkey prompt was dismissed or timed out.', 'error');
        } else {
          showMsg(err.message || 'Registration failed.', 'error');
        }
      }
    });
  </script>
</body>
</html>
