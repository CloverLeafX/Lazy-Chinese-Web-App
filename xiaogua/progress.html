<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xiaogua Download Progress</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  padding: 24px 28px;
  min-height: 100vh;
}
h1 { font-size: 1.35rem; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
.meta { font-size: 0.78rem; color: #484f58; margin-bottom: 20px; }
.meta span { color: #8b949e; }

/* ── Summary cards ── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 12px 14px;
  text-align: center;
}
.card .num { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.card .lbl {
  font-size: 0.68rem;
  color: #484f58;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 4px;
}
.card.total   .num { color: #c9d1d9; }
.card.done    .num { color: #3fb950; }
.card.dl      .num { color: #58a6ff; }
.card.failed  .num { color: #f85149; }
.card.pending .num { color: #6e7681; }

/* ── Progress bar ── */
.bar-wrap {
  background: #21262d;
  border-radius: 6px;
  height: 8px;
  margin-bottom: 10px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  background: #3fb950;
  transition: width 0.6s ease;
}
.bar-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: #6e7681;
  margin-bottom: 20px;
}
.bar-info .pct { color: #8b949e; font-weight: 500; }

/* ── Filter bar ── */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #8b949e;
  padding: 4px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.filter-btn:hover { background: #2d333b; color: #c9d1d9; }
.filter-btn.active {
  background: #1f6feb;
  border-color: #1f6feb;
  color: #fff;
}

/* ── Table ── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid #30363d;
  color: #6e7681;
  font-weight: 500;
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: #0d1117;
}
td { padding: 7px 10px; border-bottom: 1px solid #161b22; vertical-align: middle; }
tr:hover td { background: #161b22; }
.title-cell {
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
td.right { text-align: right; color: #6e7681; }

/* ── Badges ── */
.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
}
.s-done        { background: #0f3820; color: #3fb950; }
.s-downloading { background: #0c2340; color: #58a6ff; animation: pulse 1.2s ease-in-out infinite; }
.s-pending     { background: #1c2128; color: #6e7681; }
.s-failed      { background: #3d0f0f; color: #f85149; }
.a-free        { background: #0f2940; color: #79c0ff; }
.a-member      { background: #2a1f3d; color: #bc8cff; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.55; }
}

/* ── Error tooltip ── */
.err-icon { cursor: help; color: #f85149; font-size: 0.75rem; }
</style>
</head>
<body>

<h1>Xiaogua Chinese — Download Progress</h1>
<div class="meta">Auto-refreshes every 3 s &nbsp;·&nbsp; Last updated: <span id="updated">—</span></div>

<div class="cards" id="cards">
  <div class="card total"><div class="num">—</div><div class="lbl">Total</div></div>
</div>

<div class="bar-wrap"><div class="bar-fill" id="bar" style="width:0%"></div></div>
<div class="bar-info">
  <span id="bar-label">Loading…</span>
  <span class="pct" id="bar-pct">0%</span>
</div>

<div class="filters">
  <button class="filter-btn active" data-f="all"         onclick="setFilter('all')">All</button>
  <button class="filter-btn"        data-f="downloading" onclick="setFilter('downloading')">Downloading</button>
  <button class="filter-btn"        data-f="pending"     onclick="setFilter('pending')">Pending</button>
  <button class="filter-btn"        data-f="done"        onclick="setFilter('done')">Done</button>
  <button class="filter-btn"        data-f="failed"      onclick="setFilter('failed')">Failed</button>
</div>

<div class="tbl-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Title</th>
      <th>Level</th>
      <th>Access</th>
      <th>Status</th>
      <th style="text-align:right">Min</th>
      <th style="text-align:right">MB</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
let filter = 'all';
let allVideos = [];

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.f === f);
  });
  renderTable();
}

function statusBadge(s) {
  const cls = { done: 's-done', downloading: 's-downloading', pending: 's-pending', failed: 's-failed' }[s] || 's-pending';
  return `<span class="badge ${cls}">${s}</span>`;
}

function renderTable() {
  const rows = filter === 'all' ? allVideos : allVideos.filter(v => v.status === filter);
  document.getElementById('tbody').innerHTML = rows.map((v, i) => {
    const errHint = v.error
      ? ` <span class="err-icon" title="${v.error.replace(/"/g, '&quot;')}">⚠</span>`
      : '';
    return `<tr>
      <td style="color:#484f58">${i + 1}</td>
      <td class="title-cell" title="${v.title.replace(/"/g, '&quot;')}">${v.title}</td>
      <td style="color:#6e7681;white-space:nowrap">${v.level || '—'}</td>
      <td><span class="badge ${v.access === 'member' ? 'a-member' : 'a-free'}">${v.access || 'free'}</span></td>
      <td>${statusBadge(v.status)}${errHint}</td>
      <td class="right">${v.minutes || '—'}</td>
      <td class="right">${v.size_mb != null ? v.size_mb : '—'}</td>
    </tr>`;
  }).join('');
}

function fmtEta(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return '< 1 min';
  if (m < 60) return `~${m} min`;
  const h = Math.floor(m / 60), rem = m % 60;
  return `~${h}h ${rem}m`;
}

async function refresh() {
  try {
    const r = await fetch('data/progress.json?_=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const s = data.stats || {};
    allVideos = data.videos || [];

    document.getElementById('updated').textContent = data.updated || '—';

    // Cards
    document.getElementById('cards').innerHTML = `
      <div class="card total">  <div class="num">${s.total  ?? 0}</div><div class="lbl">Total</div></div>
      <div class="card done">   <div class="num">${s.done   ?? 0}</div><div class="lbl">Done</div></div>
      <div class="card dl">     <div class="num">${s.downloading ?? 0}</div><div class="lbl">Downloading</div></div>
      <div class="card failed"> <div class="num">${s.failed ?? 0}</div><div class="lbl">Failed</div></div>
      <div class="card pending"><div class="num">${s.pending ?? 0}</div><div class="lbl">Pending</div></div>
    `;

    // Bar
    const total = s.total || 1;
    const pct = ((s.done ?? 0) / total * 100);
    document.getElementById('bar').style.width = pct.toFixed(1) + '%';
    document.getElementById('bar-pct').textContent = pct.toFixed(1) + '%';

    // ETA
    const label = document.getElementById('bar-label');
    if ((s.pending ?? 0) === 0 && (s.done ?? 0) > 0) {
      label.textContent = `Complete! ${s.done} downloaded, ${s.failed ?? 0} failed.`;
    } else {
      const doneItems = allVideos.filter(v => v.status === 'done' && v.started_at && v.finished_at);
      if (doneItems.length > 2 && (s.pending ?? 0) > 0) {
        const avgMs = doneItems.reduce((sum, v) => {
          return sum + (new Date(v.finished_at) - new Date(v.started_at));
        }, 0) / doneItems.length;
        const etaMs = ((s.pending ?? 0) / 2) * avgMs; // 2 concurrent
        label.textContent = `${s.done ?? 0} done · ${s.pending ?? 0} pending · ETA ${fmtEta(etaMs)}`;
      } else {
        label.textContent = `${s.done ?? 0} done · ${s.pending ?? 0} pending`;
      }
    }

    renderTable();
  } catch (e) {
    document.getElementById('updated').textContent = 'error — retrying…';
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
